# Gazebo model profile: 30 rays, 10 Hz, canonical per-point time=0.
# R/t and processing clock are overridden from the selected p9nav-sim profile.
/**:
  ros__parameters:
    use_imu_as_input: false
    prop_at_freq_of_imu: true
    check_satu: true
    init_map_size: 10
    point_filter_num: 1
    space_down_sample: true
    filter_size_surf: 0.1
    filter_size_map: 0.1
    cube_side_length: 200.0
    common:
      lid_topic: /p9/points
      imu_topic: /p9/imu
      con_frame: false
      cut_frame: false
      time_lag_imu_to_lidar: 0.0
    preprocess:
      lidar_type: 5
      timestamp_unit: 0
      scan_line: 30
      blind: 0.2
      scan_rate: 10
    mapping:
      imu_en: true
      start_in_aggressive_motion: false
      extrinsic_est_en: false
      imu_time_inte: 0.005
      acc_cov_output: 500.0
      gyr_cov_output: 1000.0
      imu_meas_omg_cov: 0.01
      acc_norm: 9.81
      satu_acc: 30.0
      satu_gyro: 35.0
      lidar_meas_cov: 0.01
      acc_cov_input: 0.01
      gyr_cov_input: 0.001
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      plane_thr: 0.1
      match_s: 81.0
      fov_degree: 360.0
      det_range: 25.0
      gravity_align: true
      gravity:
      - 0.0
      - 0.0
      - -9.81
      gravity_init:
      - 0.0
      - 0.0
      - -9.81
      extrinsic_T:
      - 0.03799999999999999
      - 0.092
      - -0.030000000000000027
      extrinsic_R:
      - -0.9999999560952156
      - 0.00028616877043835466
      - 7.692204904555457e-05
      - 6.579776513858822e-20
      - -0.25958519950284786
      - 0.9657202101018011
      - 0.0002963267905599573
      - 0.9657201677020635
      - 0.2595851881058157
    odometry:
      publish_odometry_without_downsample: false
    publish:
      path_en: false
      scan_publish_en: true
      scan_bodyframe_pub_en: false
    runtime_pos_log_enable: false
    pcd_save:
      pcd_save_en: false
      interval: -1
    use_sim_time: true
