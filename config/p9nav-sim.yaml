# Explicit P9 navigation sim profile. Legacy P9 examples are unchanged.
# Requires the bundled Gazebo sensor adapter; raw Gazebo points lack the canonical time field.
version: 1
profile_mode: sim
calibration:
  status: synthetic
  note: 'Exact virtual sensor installation from simulation/sensor_model/model_manifest.json,
    source SHA256=c36b988488a7ebb6aafa375d0524748216349ba934339267d0ea2bbdcf2786fc;
    validate expanded URDF against this model at runtime. It does not represent the
    real D435i. Uses the bundled simulation/p9_sensor_adapter.py output: original
    LiDAR coordinates, body filtering, instantaneous point time=0 and linearly merged
    camera-location IMU. All real-robot bias and epoch offsets are disabled; no world/screenshot
    alignment.'
